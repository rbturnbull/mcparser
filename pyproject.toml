[project]
name = "llmparser"
version = "0.1.0"
description = "Uses an LLM to perform dependency parsing."
authors = [
    {name = "Robert Turnbull",email = "robert.turnbull@unimelb.edu.au"}
]
license = {text = "Apache-2.0"}
readme = "README.rst"
requires-python = ">3.10,<4.0"
dependencies = [
    "llmloader (>=0.1.9,<0.2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

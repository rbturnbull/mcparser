[project]
name = "llmparser"
version = "0.2.0"
description = "Uses LLM agents to perform dependency parsing, with an MCP server over CoNLL-U corpora."
authors = [{ name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au" }]
license = { text = "Apache-2.0" }
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "pydantic>=2.10",
    "typer>=0.15",
    "pyyaml>=6.0",
]

[project.scripts]
llmparser = "llmparser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmparser"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=llmparser --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["llmparser"]
branch = true

[tool.coverage.report]
precision = 2
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

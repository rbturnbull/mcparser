name: testing

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      # pyproject.toml makes pytest fail below 100% line and branch coverage.
      # The tests never call a real model, so no API key is needed.
      - name: Run tests
        run: uv run --locked pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"

      - name: Build and check the package
        run: |
          uv build
          uvx twine check dist/*

      - name: Install the wheel and run the CLI
        run: |
          uv venv --python 3.13 /tmp/wheel-test
          uv pip install --python /tmp/wheel-test/bin/python dist/*.whl
          /tmp/wheel-test/bin/mcparser --version
          /tmp/wheel-test/bin/mcparser --help
